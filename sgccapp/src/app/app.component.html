<head>
	<title>SGCC</title>
</head>


<!-- Cabeçalho -->
<header class="p-3 mb-3 border-bottom">
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-light">
      <!-- Logo -->
      <a routerLink="/login" href="/" class="navbar-brand d-flex align-items-center mb-2 mb-lg-0 link-body-emphasis text-decoration-none">
        <svg class="bi me-2" width="120" height="32"><use xlink:href="#Camada_1"/></svg>
      </a>

      <!-- Botão do Menu Sanduíche -->
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Offcanvas Menu -->
      <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="nav nav-pills navbar-nav me-auto mb-auto mb-lg-0">
            <li class="nav-item"><a routerLink="/equipamentos" class="nav-link link-secondary">Equipamentos</a></li>
            <li class="nav-item"><a routerLink="/manutencao" class="nav-link link-body-emphasis">Manutenções</a></li>
            <li class="nav-item"><a routerLink="/pecas" class="nav-link link-body-emphasis">Peças</a></li>
            <li class="nav-item"><a routerLink="/agencias" class="nav-link link-body-emphasis">Agências</a></li>
            <li class="nav-item"><a routerLink="/servidores" class="nav-link link-body-emphasis">Servidores</a></li>
            <li class="nav-item"><a routerLink="/usuarios" class="nav-link link-body-emphasis">Usuários</a></li>
            <li class="nav-item"><a routerLink="/relatorios" class="nav-link link-body-emphasis">Relatórios</a></li>
          </ul>

          <hr>

          <!-- Perfil (Itens que não colapsam) -->
          <div class="dropdown">
            <!-- Foto de Perfil -->
            <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
              <img src="https://github.com/mdo.png" alt="mdo" width="32" height="32" class="rounded-circle">
            </a>

            <!-- Menu Dropdown -->
            <ul class="dropdown-menu text-small">
              <li><a class="dropdown-item" data-bs-toggle="modal" data-bs-target="#settingsModal">Opções</a></li>
              <li><a class="dropdown-item" data-bs-toggle="modal" data-bs-target="#userModal">Perfil</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#logoutModal">Sign out</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>


<!-- Conteudo Principal -->
<main id="main" class="flex-fill bg-white" data-bs-theme="auto">
  <body data-bs-theme="auto">
    <router-outlet></router-outlet>
  </body>

  <!-- Modais -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" >
        <div class="modal-header">
          <h5 class="modal-title" id="userModalLabel">Informações Pessoais</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="fullName" class="form-label">Nome Completo</label>
              <input type="text" class="form-control" id="fullName" [(ngModel)]="user.fullName" [disabled]="!isEditing">
            </div>
            <div class="mb-3">
              <label for="birthDate" class="form-label">Data de Nascimento</label>
              <input type="date" class="form-control" id="birthDate" [(ngModel)]="user.birthDate" [disabled]="!isEditing">
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email Institucional</label>
              <input type="email" class="form-control" id="email" [(ngModel)]="user.email" [disabled]="!isEditing">
            </div>
            <div class="mb-3">
              <label for="registration" class="form-label">Inscrição Institucional</label>
              <input type="text" class="form-control" id="registration" [(ngModel)]="user.registration" [disabled]="!isEditing">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          <button *ngIf="!isEditing" type="button" class="btn btn-primary" (click)="editUser()">Editar</button>
          <button *ngIf="isEditing" type="button" class="btn btn-success" (click)="saveUser()">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Confirmação de Logout -->
  <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="logoutModalLabel">Confirmar Logout</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Tem certeza de que deseja sair da sua conta?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" (click)="confirmLogout()">Logout</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal de Configurações -->
  <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="settingsModalLabel">Configurações</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <!-- Seção de Idioma -->
                    <div class="mb-3">
                        <label for="languageSelect" class="form-label">Selecione o Idioma</label>
                        <select class="form-select" id="languageSelect">
                            <option value="pt-BR">Português (Brasil)</option>
                            <option value="en-US">Inglês (Estados Unidos)</option>
                            <option value="es-ES">Espanhol (Espanha)</option>
                            <option value="fr-FR">Francês (França)</option>
                        </select>
                    </div>

                    <!-- Seção de Acessibilidade -->
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="accessibilityCheck">
                        <label class="form-check-label" for="accessibilityCheck">Ativar Modo de Acessibilidade de Leitura</label>
                    </div>

                    <!-- Outras Configurações -->
                    <div class="mb-3">
                        <label for="notifications" class="form-label">Notificações</label>
                        <select class="form-select" id="notifications">
                            <option value="enabled">Ativar</option>
                            <option value="disabled">Desativar</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                <button type="button" class="btn btn-primary" (click)="saveSettings()">Salvar Configurações</button>
            </div>
        </div>
    </div>
  </div>

</main>

<!-- Footer -->
<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
  <p class="col-md-4 mb-0 text-body-secondary">&copy; 2024 INSS</p>

  <a href="/" class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
    <svg class="bi me-2" width="120" height="32"><use xlink:href="#Camada_1"/></svg>
  </a>

  <ul class="nav col-md-4 justify-content-end">
    <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Home</a></li>
    <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Links</a></li>
    <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Manual</a></li>
    <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">FAQs</a></li>
    <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Sobre</a></li>
  </ul>
</footer>

<!-- Botão de Mudar Tema -->

<div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">
  <button class="btn btn-primary py-2 dropdown-toggle d-flex align-items-center"
          id="bd-theme"
          type="button"
          aria-expanded="false"
          data-bs-toggle="dropdown"
          [attr.aria-label]="'Toggle theme (' + currentTheme + ')'">
    <svg class="bi my-1 theme-icon-active" width="1em" height="1em">
      <use href="#circle-half"></use>
    </svg>
    <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
  </button>
  
  <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
    <li>
      <button type="button" class="dropdown-item d-flex align-items-center"
              (click)="toggleTheme('light')"
              [class.active]="currentTheme === 'light'"
              [attr.aria-pressed]="currentTheme === 'light' ? 'true' : 'false'">
        <svg class="bi me-2 opacity-50" width="1em" height="1em">
          <use href="#sun-fill"></use>
        </svg>
        Light
      </button>
    </li>
    <li>
      <button type="button" class="dropdown-item d-flex align-items-center"
              (click)="toggleTheme('dark')"
              [class.active]="currentTheme === 'dark'"
              [attr.aria-pressed]="currentTheme === 'dark' ? 'true' : 'false'">
        <svg class="bi me-2 opacity-50" width="1em" height="1em">
          <use href="#moon-stars-fill"></use>
        </svg>
        Dark
      </button>
    </li>
    <li>
      <button type="button" class="dropdown-item d-flex align-items-center"
              (click)="toggleTheme('auto')"
              [class.active]="currentTheme === 'auto'"
              [attr.aria-pressed]="currentTheme === 'auto' ? 'true' : 'false'">
        <svg class="bi me-2 opacity-50" width="1em" height="1em">
          <use href="#circle-half"></use>
        </svg>
        Auto
      </button>
    </li>
  </ul>
</div>
