<!-- requisicoes.component.html -->
<div class="container mt-4">
    <h3 class="fw-bold mb-4">Requisições de Equipamentos</h3>
  
    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead class="table-active">
          <tr>
            <th scope="col">Solicitante</th>
            <th scope="col">Setor</th>
            <th scope="col">Status</th>
            <th scope="col">Data</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let requisicao of requisicoes; let i = index" (click)="openDetalhesModal(i)">
            <td>{{ requisicao.solicitante }}</td>
            <td>{{ requisicao.setor }}</td>
            <td>{{ requisicao.status }}</td>
            <td>{{ requisicao.data | date }}</td>
            <td>
              <button class="btn btn-sm btn-success me-2" (click)="aprovarRequisicao(i)">Aprovar</button>
              <button class="btn btn-sm btn-warning me-2" (click)="encaminharRequisicao(i)">Encaminhar</button>
              <button class="btn btn-sm btn-danger" (click)="excluirRequisicao(i)">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <!-- Modal de Detalhes da Requisição -->
    <div class="modal fade" id="detalhesModal" tabindex="-1" aria-labelledby="detalhesModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="detalhesModalLabel">Detalhes da Requisição</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="solicitante" class="form-label">Solicitante</label>
              <input type="text" class="form-control" id="solicitante" [value]="requisicaoSelecionada?.solicitante" readonly>
            </div>
            <div class="mb-3">
              <label for="setor" class="form-label">Setor</label>
              <input type="text" class="form-control" id="setor" [value]="requisicaoSelecionada?.setor" readonly>
            </div>
            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <input type="text" class="form-control" id="status" [value]="requisicaoSelecionada?.status" readonly>
            </div>
            <div class="mb-3">
              <label for="data" class="form-label">Data</label>
              <input type="text" class="form-control" id="data" [value]="requisicaoSelecionada?.data | date" readonly>
            </div>
            <div class="mb-3">
              <label for="descricao" class="form-label">Descrição</label>
              <textarea class="form-control" id="descricao" rows="3" [value]="requisicaoSelecionada?.descricao" readonly></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
