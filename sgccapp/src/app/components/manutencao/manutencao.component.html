<style>
  .form-control, .form-select {
    border-width: 3px; /* Aumentando a espessura da borda */
  }
</style>

<div class="container mt-4">
  <!-- Título da página -->
  <h3 class="fw-bold mb-4">Gestão de Manutenções</h3>
  <h5 class="mb-4">Lista das manutenções realizadas nos equipamentos</h5>

  <!-- Contêiner flexível para os botões -->
  <div class="d-flex justify-content-between mb-3">
    <!-- Botão para ocultar e abrir os filtros -->
    <button class="btn btn-secondary mb-3" (click)="toggleFiltros()">
      {{ mostrarFiltros ? 'Ocultar Filtros' : 'Mostrar Filtros' }}
    </button>

    <!-- Botão para adicionar nova manutenção -->
    <button class="btn btn-primary mb-3" (click)="openAddModal()">Adicionar Manutenção</button>
  </div>

  <!-- Filtros para a tabela -->
  <div class="row mb-3" *ngIf="mostrarFiltros">
    <div class="col-md-3 mb-3">
      <label for="filterCodigo" class="form-label">Código</label>
      <input type="text" id="filterCodigo" class="form-control" [(ngModel)]="filtroCodigo">
    </div>
    <div class="col-md-3 mb-3">
      <label for="filterEquipamento" class="form-label">Equipamento</label>
      <input type="text" id="filterEquipamento" class="form-control" [(ngModel)]="filtroEquipamento">
    </div>
    <div class="col-md-3 mb-3">
      <label for="filterResponsavel" class="form-label">Responsável</label>
      <input type="text" id="filterResponsavel" class="form-control" [(ngModel)]="filtroResponsavel">
    </div>
    <div class="col-md-3 mb-3">
      <label for="filterDescricao" class="form-label">Descrição</label>
      <input type="text" id="filterDescricao" class="form-control" [(ngModel)]="filtroDescricao">
    </div>
  </div>

  <!-- Tabela de Manutenções -->
  <div class="table-responsive min-vh-100">
    <table class="table table-striped table-bordered">
      <thead class="table-active" app-thead-ordenacao
        [colunas]="colunas"
        (ordenacaoAtualizada)="ordenar($event)">
      </thead>
      <tbody>
        <tr *ngFor="let manutencao of registrosFiltrados()">
          <td>{{ manutencao.codigo }}</td>
          <td>{{ manutencao.equipamento?.nome }}</td>
          <td>{{ manutencao.responsavel?.nome_completo }}</td>
          <td>{{ manutencao.data | date }}</td>
          <td>{{ manutencao.descricao }}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2 mb-2" (click)="openEditModal(manutencao)">Editar</button>
            <button class="btn btn-sm btn-danger mb-2" (click)="openDeleteModal(manutencao.id)">Excluir</button>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="6">
            <span *ngIf="registros.length == 0">Nenhum registro encontrado</span>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
