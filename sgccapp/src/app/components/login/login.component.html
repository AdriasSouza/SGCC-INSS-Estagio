<style>
  .form-control, .form-select {
    border-width: 3px; /* Aumentando a espessura da borda */
  }
</style>

<div class="form-signin vh-100 m-auto d-flex flex-column justify-content-center">
  <form class="w-100" style="max-width: 330px; margin: auto;" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h1 class="h3 mb-3 fw-normal">Por favor, faça login</h1>

    <div class="form-floating">
      <input type="email" class="form-control" id="floatingInput" placeholder="Email" formControlName="email" name="email">
      <label for="floatingInput">Email</label>
      <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-danger">
        Email é obrigatório e deve ser válido.
      </div>
    </div>
    <div class="form-floating">
      <input type="password" class="form-control" id="floatingPassword" placeholder="Senha" formControlName="password" name="password">
      <label for="floatingPassword">Senha</label>
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger">
        Senha é obrigatória.
      </div>
    </div>

    <div class="form-check text-start my-3">
      <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
      <label class="form-check-label" for="flexCheckDefault">
        Lembre de mim
      </label>
    </div>
    <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loginForm.invalid">Login</button>
    <div *ngIf="errorMessage" class="text-danger mt-3">
      {{ errorMessage }}
    </div>
    <p class="mt-5 mb-3 text-body-secondary">&copy; 2024</p>
  </form>
</div>
