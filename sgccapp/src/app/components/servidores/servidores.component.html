<style>
  .form-control, .form-select {
    border-width: 3px; /* Aumentando a espessura da borda */
  }
</style>

<div class="container mt-4">
  <!-- Título da página -->
  <h3 class="fw-bold mb-4">Gestão de Servidores</h3>
  <h5 class="mb-4">Tabela com todos os servidores registrados no sistema</h5>

  <!-- Contêiner flexível para os botões -->
  <div class="d-flex justify-content-between mb-3">
    <!-- Botão para adicionar novo servidor -->
    <button class="btn btn-primary mb-3" (click)="openAddModal()">Adicionar Servidor</button>
  </div>

  <!-- Spinner de Carregamento -->
  <div class="text-center my-4">
    <div class="spinner-border" role="status" *ngIf="loading">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Tabela de Servidores -->
  <div class="table-responsive min-vh-100">
    <table class="table table-striped table-bordered" *ngIf="!loading">
      <thead class="table-active" app-thead-ordenacao
        [colunas]="colunas"
        (ordenacaoAtualizada)="ordenar($event)">
      </thead>
      <tbody>
        <tr *ngFor="let servidor of registrosFiltrados()">
          <td>{{ servidor.inscricao_institucional }}</td>
          <td>{{ servidor.nome_completo }}</td>
          <td>{{ servidor.setor?.nome }}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2 mb-2" (click)="openEditModal(servidor)">Editar</button>
            <button class="btn btn-sm btn-danger mb-2" (click)="delete(servidor.id)">Excluir</button>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="5">
            <span *ngIf="registros.length == 0">Nenhum servidor encontrado</span>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<!-- Modal de Adição de Servidor -->
<div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addModalLabel">Adicionar Servidor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="addForm" (ngSubmit)="confirmAdd()">
          <div class="mb-3">
            <label for="addInscricao" class="form-label">Inscrição Institucional</label>
            <input type="text" class="form-control" id="addInscricao" formControlName="inscricao_institucional">
          </div>
          <div class="mb-3">
            <label for="addNome" class="form-label">Nome Completo</label>
            <input type="text" class="form-control" id="addNome" formControlName="nome_completo">
          </div>
          <div class="mb-3">
            <label for="addChefe" class="form-label">Chefe</label>
            <input type="checkbox" class="form-check-input" id="addChefe" formControlName="chefe">
          </div>
          <div class="mb-3">
            <label for="addSetor" class="form-label">Setor</label>
            <select id="addSetor" class="form-select" formControlName="setor">
              <option *ngFor="let setor of setores" [value]="setor.id">{{ setor.nome }}</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary me-2">Adicionar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Edição de Servidor -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Editar Servidor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="editForm" (ngSubmit)="confirmEdit()">
          <div class="mb-3">
            <label for="editInscricao" class="form-label">Inscrição Institucional</label>
            <input type="text" class="form-control" id="editInscricao" formControlName="inscricao_institucional">
          </div>
          <div class="mb-3">
            <label for="editNome" class="form-label">Nome Completo</label>
            <input type="text" class="form-control" id="editNome" formControlName="nome_completo">
          </div>
          <div class="mb-3">
            <label for="editChefe" class="form-label">Chefe</label>
            <input type="checkbox" class="form-check-input" id="editChefe" formControlName="chefe">
          </div>
          <div class="mb-3">
            <label for="editSetor" class="form-label">Setor</label>
            <select id="editSetor" class="form-select" formControlName="setor">
              <option *ngFor="let setor of setores" [value]="setor.id">{{ setor.nome }}</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary me-2">Salvar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </form>
      </div>
    </div>
  </div>
</div>
