<!-- servidores.component.html -->
<div class="container mt-5">
    <h2 class="mb-4">Gerenciamento de Servidores</h2>
    
    <form (ngSubmit)="saveServidor()" #servidorForm="ngForm">
      <div class="row mb-3">
        <div class="col">
          <label for="codigo" class="form-label">Código</label>
          <input type="text" class="form-control" id="codigo" [(ngModel)]="selectedServidor.codigo" name="codigo" required>
        </div>
        <div class="col">
          <label for="nomeCompleto" class="form-label">Nome Completo</label>
          <input type="text" class="form-control" id="nomeCompleto" [(ngModel)]="selectedServidor.nome_completo" name="nomeCompleto" required>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col">
          <label for="dataNascimento" class="form-label">Data de Nascimento</label>
          <input type="date" class="form-control" id="dataNascimento" [(ngModel)]="selectedServidor.data_nascimento" name="dataNascimento" required>
        </div>
        <div class="col">
          <label for="idSetor" class="form-label">ID do Setor</label>
          <input type="number" class="form-control" id="idSetor" [(ngModel)]="selectedServidor.id_setor" name="idSetor" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Salvar Servidor</button>
      <button type="button" class="btn btn-secondary" (click)="resetServidorForm()">Cancelar</button>
    </form>
  
    <h3 class="mt-5">Lista de Servidores</h3>
    <table class="table table-bordered mt-3">
      <thead>
        <tr>
          <th>ID</th>
          <th>Código</th>
          <th>Nome Completo</th>
          <th>Data de Nascimento</th>
          <th>ID do Setor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let servidor of servidores">
          <td>{{ servidor.id }}</td>
          <td>{{ servidor.codigo }}</td>
          <td>{{ servidor.nome_completo }}</td>
          <td>{{ servidor.data_nascimento | date: 'dd/MM/yyyy' }}</td>
          <td>{{ servidor.id_setor }}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="editServidor(servidor)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="deleteServidor(servidor.id)">Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
