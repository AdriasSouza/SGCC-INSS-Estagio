<style>
  .form-control, .form-select {
    border-width: 3px; /* Aumentando a espessura da borda */
  }
</style>

<div class="container mt-4">
  <!-- Título da página -->
  <h3 class="fw-bold mb-4">Gestão de Setores</h3>
  <h5 class="mb-4">Tabela com todos os setores registrados no sistema</h5>

  <!-- Contêiner flexível para os botões -->
  <div class="d-flex justify-content-between mb-3">
    <!-- Botão para adicionar novo setor -->
    <button class="btn btn-primary mb-3" (click)="openAddModal()">Adicionar Setor</button>
  </div>

  <!-- Spinner de Carregamento -->
  <div class="text-center my-4">
    <div class="spinner-border" role="status" *ngIf="loading">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Tabela de Setores -->
  <div class="table-responsive min-vh-100">
    <table class="table table-striped table-bordered" *ngIf="!loading">
      <thead class="table-active">
        <tr>
          <th>Nome</th>
          <th>Código</th>
          <th>Chefe</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let setor of setores">
          <td>{{ setor.nome }}</td>
          <td>{{ setor.codigo }}</td>
          <td>{{ getChefeDoSetor(setor.id) }}</td>
          <td>
            <button class="btn btn-sm btn-primary me-2" (click)="openEditModal(setor)">Editar</button>
            <button class="btn btn-sm btn-danger" (click)="deleteSetor(setor.id)">Excluir</button>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="4">
            <span *ngIf="setores.length == 0">Nenhum setor encontrado</span>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<!-- Modal de Adição de Setor -->
<div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addModalLabel">Adicionar Setor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="addForm" (ngSubmit)="confirmAdd()">
          <div class="mb-3">
            <label for="addNome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="addNome" formControlName="nome">
          </div>
          <div class="mb-3">
            <label for="addCodigo" class="form-label">Código</label>
            <input type="text" class="form-control" id="addCodigo" formControlName="codigo">
          </div>
          <button type="submit" class="btn btn-primary me-2">Adicionar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modal de Edição de Setor -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Editar Setor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form [formGroup]="editForm" (ngSubmit)="confirmEdit()">
          <div class="mb-3">
            <label for="editNome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="editNome" formControlName="nome">
          </div>
          <div class="mb-3">
            <label for="editCodigo" class="form-label">Código</label>
            <input type="text" class="form-control" id="editCodigo" formControlName="codigo">
          </div>
          <button type="submit" class="btn btn-primary me-2">Salvar</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </form>
      </div>
    </div>
  </div>
</div>
