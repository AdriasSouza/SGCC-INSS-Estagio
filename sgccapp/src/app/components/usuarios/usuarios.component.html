<style>
  .form-control, .form-select {
    border-width: 3px; /* Aumentando a espessura da borda */
  }
</style>

<div class="container mt-4">
  <!-- Título da página -->
  <h3 class="fw-bold mb-4">Gestão de Usuários</h3>
  <h5 class="mb-4">Tabela com todos os usuários registrados no sistema</h5>

  <!-- Botão para adicionar novo usuário -->
  <button class="btn btn-primary mb-3" (click)="openAddModal()">Adicionar Usuário</button>

  <!-- Campo de busca -->
  <div class="mb-3">
    <label for="searchInput" class="form-label">Buscar Usuário</label>
    <input type="text" id="searchInput" class="form-control" placeholder="Código, Email ou Nome"/>
  </div>

  <!-- Botão para ocultar e abrir os filtros -->
  <button class="btn btn-secondary mb-3" (click)="toggleFiltros()">
    {{ mostrarFiltros ? 'Ocultar Filtros' : 'Mostrar Filtros' }}
  </button>

  <!-- Filtros -->
  <div class="row mb-3" *ngIf="mostrarFiltros">
    <div class="col-md-4 mb-3">
      <label for="setorSelect" class="form-label">Setor</label>
      <select id="setorSelect" class="form-select">
        <option value="">Todos os Setores</option>
        <option value="Gerência">Gerência</option>
        <option value="Logística">Logística</option>
      </select>
    </div>

    <div class="col-md-4 mb-3">
      <label for="dataInicio" class="form-label">Data Início</label>
      <input type="date" id="dataInicio" class="form-control">
    </div>

    <div class="col-md-4 mb-3">
      <label for="dataFim" class="form-label">Data Fim</label>
      <input type="date" id="dataFim" class="form-control">
    </div>
  </div>

  <!-- Spinner de Carregamento -->
  <div class="text-center my-4">
    <div class="spinner-border" role="status" *ngIf="loading">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Tabela de Usuários -->
  <div class="table-responsive min-vh-100">
    <table class="table table-striped table-bordered" *ngIf="!loading">
      <thead app-thead-ordenacao
        [colunas]="colunas"
        (ordenacaoAtualizada)="ordenar($event)">
      </thead>
      <tbody>
        <tr *ngFor="let usuario of registros">
          <td>{{usuario.id}}</td>
          <td>{{usuario.email}}</td>
          <td>
            <button class="btn btn-warning btn-sm" (click)="usuario.id !== undefined && openEditModal(usuario.id)">Editar</button>
            <button class="btn btn-danger btn-sm" (click)="usuario.id !== undefined && openDeleteModal(usuario.id)">Excluir</button>
          </td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="3">
            <!-- <span *ngIf="registros.length > 0">Total de registros: {{ respostaPaginada.totalElements }}</span> -->
            <span *ngIf="registros.length == 0">Nenhum registro encontrado</span>
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
