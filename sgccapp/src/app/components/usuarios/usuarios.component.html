<div class="container mt-5">
    <h2>Gerenciar Usuários</h2>
    <form (ngSubmit)="adicionarUsuario()" class="mb-4">
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="codigo">Código</label>
          <input type="text" id="codigo" class="form-control" [(ngModel)]="novoUsuario.codigo" name="codigo" required>
        </div>
        <div class="form-group col-md-6">
          <label for="email">Email Institucional</label>
          <input type="email" id="email" class="form-control" [(ngModel)]="novoUsuario.email_institucional" name="email" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="form-control" [(ngModel)]="novoUsuario.senha" name="senha" required>
        </div>
        <div class="form-group col-md-6">
          <label for="tipo_usuario">Tipo de Usuário</label>
          <select id="tipo_usuario" class="form-control" [(ngModel)]="novoUsuario.tipo_usuario" name="tipo_usuario" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="ADMIN">Admin</option>
            <option value="USER">Usuário</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="id_servidor">ID do Servidor</label>
        <input type="number" id="id_servidor" class="form-control" [(ngModel)]="novoUsuario.id_servidor" name="id_servidor" required>
      </div>
      <button type="submit" class="btn btn-primary">Adicionar Usuário</button>
    </form>
  
    <h3>Lista de Usuários</h3>
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Código</th>
          <th>Email Institucional</th>
          <th>Tipo de Usuário</th>
          <th>ID do Servidor</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuarios">
          <td>{{ usuario.id }}</td>
          <td>{{ usuario.codigo }}</td>
          <td>{{ usuario.email_institucional }}</td>
          <td>{{ usuario.tipo_usuario }}</td>
          <td>{{ usuario.id_servidor }}</td>
        </tr>
      </tbody>
    </table>
  </div>
